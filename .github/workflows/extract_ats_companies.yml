name: Extract ATS Companies (Common Crawl)

on:
  workflow_dispatch:
    inputs:
      crawl:
        description: "Common Crawl ID ('ALL' or specific ID like CC-MAIN-2026-43)"
        required: true
        default: 'CC-MAIN-2026-43'
      min_year:
        description: "Earliest crawl year if using ALL (e.g. 2024, 2025, 2026)"
        required: true
        default: '2024'
      start_shard:
        description: 'Starting shard index (0 to 299) - ATS boards are in 250-299'
        required: true
        default: '270'
      num_shards:
        description: 'Number of Parquet shards to scan per crawl (1 to 30)'
        required: true
        default: '15'

  # Optional weekly schedule to discover newly indexed companies automatically
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 3:00 AM UTC

permissions:
  contents: write

jobs:
  extract-companies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb requests warcio

      - name: Run Common Crawl ATS Extraction
        run: |
          START=${{ github.event.inputs.start_shard || '0' }}
          SHARDS=${{ github.event.inputs.num_shards || '5' }}
          CRAWL=${{ github.event.inputs.crawl || 'ALL' }}
          MIN_YEAR=${{ github.event.inputs.min_year || '2024' }}

          echo "Running ATS Extraction (crawl=$CRAWL, min_year=$MIN_YEAR, start=$START, shards=$SHARDS)..."
          python gha_crawl_ats.py \
            --crawl "$CRAWL" \
            --min-year "$MIN_YEAR" \
            --start "$START" \
            --shards "$SHARDS" \
            --greenhouse-file "greenhouse_companies.txt"

      - name: Commit and Push Updated Company List
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: update greenhouse_companies.txt from Common Crawl [skip ci]"
          file_pattern: "greenhouse_companies.txt *.parquet *.csv"

