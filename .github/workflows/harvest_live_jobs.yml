name: Harvest Live ATS Jobs

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🎯 ATS Platform to harvest'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - greenhouse
          - lever
          - ashby
          - smartrecruiters
          - workable
          - recruitee
          - breezy
          - rippling
          - bamboohr
          - pinpoint
      company_source:
        description: '📁 Companies Dataset Preset'
        required: true
        type: choice
        default: 'exports/us_companies_by_ats_master.csv'
        options:
          - 'exports/us_companies_by_ats_master.csv'
          - 'greenhouse_companies_us_active.txt'
          - 'exports/us_greenhouse_companies.csv'
          - 'exports/us_lever_companies.csv'
          - 'exports/us_ashby_companies.csv'
          - 'exports/us_smartrecruiters_companies.csv'
          - 'exports/us_workable_companies.csv'
          - 'exports/us_workday_companies.csv'
          - 'exports/us_rippling_companies.csv'
          - 'exports/us_bamboohr_companies.csv'
          - 'exports/us_recruitee_companies.csv'
          - 'exports/us_breezy_companies.csv'
          - 'exports/us_pinpoint_companies.csv'
          - 'custom'
      custom_input_path:
        description: '📝 Custom File Path (used only if "company_source" is custom)'
        required: false
        type: string
        default: ''
      single_slug:
        description: '⚡ Single Company Quick Test (e.g. "speechify", "netflix", "stripe" - overrides file)'
        required: false
        type: string
        default: ''
      limit:
        description: '🔢 Max Companies to Scan (0 for entire file)'
        required: true
        type: string
        default: '500'
      offset:
        description: '⏭️ Starting Offset Index (for chunked runs: 0, 500, 1000...)'
        required: true
        type: string
        default: '0'
      posted_within_days:
        description: '📅 Recency Filter (Keep jobs posted within last N days)'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
          - '3'
          - '7'
          - '14'
          - '30'
          - '60'
          - '90'
      title_keyword:
        description: '🔍 Keyword Filter (e.g. "Software", "AI", "Engineer", "Data" - blank for all)'
        required: false
        type: string
        default: ''
      only_us:
        description: '🇺🇸 Only Keep US & US-Remote Postings'
        required: true
        type: boolean
        default: true
      full_content:
        description: '📄 Fetch Full HTML Job Description (slower; uncheck for fast indexing)'
        required: true
        type: boolean
        default: false
      concurrency:
        description: '⚡ Async Concurrency (Max concurrent HTTP workers)'
        required: true
        type: choice
        default: '40'
        options:
          - '20'
          - '40'
          - '60'
          - '80'
      commit_to_git:
        description: '💾 Commit live_jobs.csv directly back to GitHub repository'
        required: true
        type: boolean
        default: false

  # Optional daily automated job harvest at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  harvest-jobs:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: Run Universal ATS Job Extractor
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          SOURCE="${{ github.event.inputs.company_source || 'exports/us_companies_by_ats_master.csv' }}"
          CUSTOM="${{ github.event.inputs.custom_input_path }}"
          SLUG="${{ github.event.inputs.single_slug }}"
          LIMIT="${{ github.event.inputs.limit || '500' }}"
          OFFSET="${{ github.event.inputs.offset || '0' }}"
          DAYS="${{ github.event.inputs.posted_within_days || '0' }}"
          KEYWORD="${{ github.event.inputs.title_keyword }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '40' }}"
          ONLY_US="${{ github.event.inputs.only_us }}"
          FULL_CONTENT="${{ github.event.inputs.full_content }}"

          INPUT_FILE="$SOURCE"
          if [ "$SOURCE" = "custom" ] && [ -n "$CUSTOM" ]; then
            INPUT_FILE="$CUSTOM"
          fi

          if [ -n "$SLUG" ]; then
            echo "Running Single Slug Mode: Platform=$PLATFORM, Slug=$SLUG"
            FLAGS="--platform $PLATFORM --slug $SLUG --output-db live_jobs.db --export-csv live_jobs.csv"
          else
            echo "Running Batch Mode: Source=$INPUT_FILE, Platform=$PLATFORM, Limit=$LIMIT, Offset=$OFFSET"
            FLAGS="--platform $PLATFORM --input $INPUT_FILE --output-db live_jobs.db --export-csv live_jobs.csv --limit $LIMIT --offset $OFFSET --concurrency $CONCURRENCY"
          fi

          if [ "$DAYS" != "0" ] && [ -n "$DAYS" ]; then
            FLAGS="$FLAGS --days $DAYS"
          fi

          if [ -n "$KEYWORD" ]; then
            FLAGS="$FLAGS --keyword \"$KEYWORD\""
          fi

          if [ "$ONLY_US" = "true" ] || [ -z "$ONLY_US" ]; then
            FLAGS="$FLAGS --only-us"
          fi

          if [ "$FULL_CONTENT" = "true" ]; then
            FLAGS="$FLAGS --full-content"
          fi

          echo "Executing: python extract_live_jobs.py $FLAGS"
          python extract_live_jobs.py $FLAGS

      - name: Generate Extraction Summary
        if: always()
        run: |
          python -c '
          import os, sqlite3

          db_file = "live_jobs.db"
          if not os.path.exists(db_file):
              print("No database generated.")
              exit(0)

          conn = sqlite3.connect(db_file)
          cur = conn.cursor()

          # Boards metrics
          total_boards = 0
          boards_200 = 0
          boards_with_jobs = 0
          try:
              cur.execute("SELECT COUNT(*), COUNT(CASE WHEN http_status = 200 THEN 1 END), COUNT(CASE WHEN total_jobs > 0 THEN 1 END) FROM scanned_boards;")
              row = cur.fetchone()
              if row:
                  total_boards, boards_200, boards_with_jobs = row
          except Exception:
              pass

          # Jobs metrics
          cur.execute("SELECT COUNT(*) FROM live_jobs;")
          total_jobs = cur.fetchone()[0]

          cur.execute("SELECT COUNT(posted_at) FROM live_jobs WHERE posted_at != \"\";")
          with_ts = cur.fetchone()[0]

          ts_rate = ((with_ts / total_jobs) * 100) if total_jobs > 0 else 0
          board_200_rate = ((boards_200 / total_boards) * 100) if total_boards > 0 else 0

          # Platform breakdown
          try:
              cur.execute("""
                  SELECT 
                      s.platform,
                      COUNT(s.company_slug) as scanned,
                      COUNT(CASE WHEN s.http_status = 200 THEN 1 END) as b_200,
                      COUNT(CASE WHEN s.total_jobs > 0 THEN 1 END) as b_jobs,
                      COALESCE(j.total_jobs, 0) as tot_jobs,
                      COALESCE(j.us_jobs, 0) as us_jobs,
                      COALESCE(j.ts_jobs, 0) as ts_jobs
                  FROM scanned_boards s
                  LEFT JOIN (
                      SELECT platform, COUNT(*) as total_jobs,
                             COUNT(CASE WHEN is_us = 1 THEN 1 END) as us_jobs,
                             COUNT(CASE WHEN posted_at != "" THEN 1 END) as ts_jobs
                      FROM live_jobs GROUP BY platform
                  ) j ON s.platform = j.platform
                  GROUP BY s.platform
                  ORDER BY tot_jobs DESC;
              """)
              rows = cur.fetchall()
          except Exception:
              cur.execute("""
                  SELECT platform, 0, 0, 0, COUNT(*), COUNT(CASE WHEN is_us = 1 THEN 1 END), COUNT(CASE WHEN posted_at != \"\" THEN 1 END)
                  FROM live_jobs
                  GROUP BY platform
                  ORDER BY COUNT(*) DESC;
              """)
              rows = cur.fetchall()

          cur.execute("SELECT title, company_name, location, posted_at, apply_url FROM live_jobs WHERE posted_at != \"\" ORDER BY posted_at DESC LIMIT 10;")
          recent = cur.fetchall()
          conn.close()

          summary = []
          summary.append("## 🚀 Live ATS Job Extraction Summary\n")
          if total_boards > 0:
              summary.append(f"- **Total Company Boards Scanned:** `{total_boards:,}`")
              summary.append(f"- **Boards Returning HTTP 200 (Active):** `{boards_200:,}` / `{total_boards:,}` (**{board_200_rate:.1f}%**)")
              summary.append(f"- **Boards with Live Openings:** `{boards_with_jobs:,}`")
          summary.append(f"- **Total Live Jobs Harvested:** `{total_jobs:,}`")
          summary.append(f"- **Timestamp Capture Rate:** `{with_ts:,}` / `{total_jobs:,}` (**{ts_rate:.1f}%**)\n")

          summary.append("### Breakdown by Platform\n")
          if total_boards > 0:
              summary.append("| Platform | Boards Scanned | 200 OK Boards | Boards with Jobs | Total Jobs | US Jobs | With Post Timestamp |")
              summary.append("|---|---|---|---|---|---|---|")
              for p, sc, b200, bjob, tot, us, ts in rows:
                  rate_p = ((b200 / sc) * 100) if sc > 0 else 0
                  summary.append(f"| **{p.title()}** | `{sc:,}` | `{b200:,}` ({rate_p:.1f}%) | `{bjob:,}` | `{tot:,}` | `{us:,}` | `{ts:,}` |")
          else:
              summary.append("| Platform | Total Jobs | US Jobs | With Post Timestamp |")
              summary.append("|---|---|---|---|")
              for r in rows:
                  summary.append(f"| **{r[0].title()}** | `{r[4]:,}` | `{r[5]:,}` | `{r[6]:,}` |")

          if recent:
              summary.append("\n### 🕒 Most Recently Posted Live Jobs\n")
              summary.append("| Title | Company | Location | Posted At (UTC) |")
              summary.append("|---|---|---|---|")
              for t, c, l, p, u in recent:
                  summary.append(f"| [{t}]({u}) | {c} | {l} | `{p}` |")

          summary_text = "\n".join(summary)
          print(summary_text)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary_text + "\n")
          '

      - name: Upload Harvested Datasets as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ats-jobs-dataset
          path: |
            live_jobs.db
            live_jobs.csv
          retention-days: 90

      - name: Commit and Push Results to Repository
        if: ${{ github.event.inputs.commit_to_git == 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || git merge -X ours origin/main
          git add live_jobs.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated: update live_jobs.csv from workflow run [skip ci]"
            git push origin main || git push --force-with-lease origin main
          fi
