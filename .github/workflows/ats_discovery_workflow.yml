name: Top 30 ATS Platforms Discovery & Verification (3-5 Year Window)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start Date (YYYYMMDD) for 3-5 Year Window"
        required: false
        default: "20210101"
        type: string
      to_date:
        description: "End Date (YYYYMMDD)"
        required: false
        default: "20261231"
        type: string
      sources:
        description: "Discovery sources (ct,commoncrawl,wayback)"
        required: false
        default: "ct,commoncrawl,wayback"
        type: string
      prefix_shard:
        description: "Enable 36-prefix alphanumeric sharding (a-z, 0-9) for Greenhouse/Ashby/Lever"
        required: false
        default: true
        type: boolean
      cc_indexes:
        description: "Number of Common Crawl monthly indexes (4 covers 2021-2026 releases)"
        required: false
        default: "4"
        type: string
      cc_pages:
        description: "Max CDX pages per prefix"
        required: false
        default: "20"
        type: string
      wayback_limit:
        description: "Max URLs per Wayback query"
        required: false
        default: "50000"
        type: string
      concurrency:
        description: "Max concurrent HTTP requests per runner"
        required: false
        default: "150"
        type: string
      commit_exports:
        description: "Commit exported CSV/JSONL files back to the repository"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Parallel Execution Across the Top 30 ATS Platforms (3-5 Years)
  # ---------------------------------------------------------------------------
  discover-and-verify-shards:
    name: "Shard: ${{ matrix.shard_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours per runner (GitHub hard limit)
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_id: "greenhouse"
            shard_name: "Greenhouse (US & EU)"
            platforms: "greenhouse"
          - shard_id: "modern_tech"
            shard_name: "Ashby, Lever, Rippling, Workable, Dover, Gem"
            platforms: "ashby,lever,rippling,workable,dover,gem"
          - shard_id: "mid_market_smb"
            shard_name: "BambooHR, Recruitee, Breezy, Teamtailor, Pinpoint"
            platforms: "bamboohr,recruitee,breezy,teamtailor,pinpoint"
          - shard_id: "eu_and_smb2"
            shard_name: "Personio, JazzHR, Trakstar, JOIN, Manatal"
            platforms: "personio,jazzhr,trakstar,join,manatal"
          - shard_id: "enterprise_giants"
            shard_name: "Workday, SmartRecruiters, iCIMS, Jobvite, Taleo, SuccessFactors"
            platforms: "workday,smartrecruiters,icims,jobvite,taleo,successfactors"
          - shard_id: "enterprise_and_apac"
            shard_name: "Oracle Cloud, Dayforce, UKG, Paylocity, Keka, Darwinbox, Zoho, Freshteam"
            platforms: "oracle_recruiting,dayforce,ukg,paylocity,keka,darwinbox,zohorecruit,freshteam"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install async dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached SQLite shard database
        uses: actions/cache@v4
        with:
          path: ats_shard_${{ matrix.shard_id }}.db
          key: top30-shard-${{ matrix.shard_id }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            top30-shard-${{ matrix.shard_id }}-${{ github.ref_name }}-
            top30-shard-${{ matrix.shard_id }}-

      - name: Run offline self-test suite
        run: |
          python3 ats_company_discovery_engine.py self-test

      - name: Discover Top 30 candidate boards (2021-2026 window)
        run: |
          FROM_DATE="${{ inputs.from_date || '20210101' }}"
          TO_DATE="${{ inputs.to_date || '20261231' }}"
          SOURCES="${{ inputs.sources || 'ct,commoncrawl,wayback' }}"
          CC_INDEXES="${{ inputs.cc_indexes || '4' }}"
          CC_PAGES="${{ inputs.cc_pages || '20' }}"
          WAYBACK_LIMIT="${{ inputs.wayback_limit || '50000' }}"
          CONCURRENCY="${{ inputs.concurrency || '150' }}"
          PREFIX_FLAG=""
          if [ "${{ inputs.prefix_shard }}" = "true" ] || [ -z "${{ inputs.prefix_shard }}" ]; then
            PREFIX_FLAG="--prefix-shard"
          fi

          python3 ats_company_discovery_engine.py discover \
            --db "ats_shard_${{ matrix.shard_id }}.db" \
            --sources "${SOURCES}" \
            --platforms "${{ matrix.platforms }}" \
            --from-date "${FROM_DATE}" \
            --to-date "${TO_DATE}" \
            --cc-indexes "${CC_INDEXES}" \
            --cc-pages "${CC_PAGES}" \
            --wayback-limit "${WAYBACK_LIMIT}" \
            --concurrency "${CONCURRENCY}" \
            ${PREFIX_FLAG}

      - name: Probe seed company domains if domains.txt exists
        if: hashFiles('domains.txt') != ''
        run: |
          CONCURRENCY="${{ inputs.concurrency || '150' }}"
          python3 ats_company_discovery_engine.py probe-slugs \
            --input domains.txt \
            --platforms "${{ matrix.platforms }}" \
            --db "ats_shard_${{ matrix.shard_id }}.db"

      - name: Verify candidate boards via live public ATS APIs & extract jobs
        run: |
          CONCURRENCY="${{ inputs.concurrency || '150' }}"
          python3 ats_company_discovery_engine.py verify \
            --db "ats_shard_${{ matrix.shard_id }}.db" \
            --platforms "${{ matrix.platforms }}" \
            --concurrency "${CONCURRENCY}"

      - name: Upload SQLite shard database artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-shard-${{ matrix.shard_id }}
          path: ats_shard_${{ matrix.shard_id }}.db
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 2: Global Cross-ATS Entity Resolution, Merge & CSV/JSONL Export
  # ---------------------------------------------------------------------------
  merge-and-export:
    name: Merge Top 30 Shards & Export Lists
    needs: discover-and-verify-shards
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all SQLite shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sqlite-shard-*
          path: ./shards
          merge-multiple: true

      - name: Merge Top 30 SQLite shards & run global Entity Resolution
        run: |
          SHARD_FILES=$(ls ./shards/ats_shard_*.db | paste -sd "," -)
          echo "Merging shard databases: ${SHARD_FILES}"
          python3 ats_company_discovery_engine.py merge-dbs \
            --inputs "${SHARD_FILES}" \
            --output ats_companies.db

      - name: Export Top 30 company CSVs, master JSONL & Markdown Summary
        run: |
          python3 ats_company_discovery_engine.py export \
            --db ats_companies.db \
            --output-dir ./exports
          cat ./exports/SUMMARY.md >> $GITHUB_STEP_SUMMARY
          ls -lh ./exports

      - name: Upload Top 30 company lists & master SQLite DB
        uses: actions/upload-artifact@v4
        with:
          name: top-30-ats-companies-${{ github.run_number }}
          path: |
            exports/*.csv
            exports/*.jsonl
            exports/SUMMARY.md
            ats_companies.db
          retention-days: 30

      - name: Commit updated exports to repository (Optional)
        if: ${{ inputs.commit_exports == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          git diff --staged --quiet || (git commit -m "chore(data): update Top 30 ATS company lists [skip ci]" && git push)
